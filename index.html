    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --gray-950: #0a0a0a;
            --gray-900: #0f0f0f;
            --gray-800: #171717;
            --gray-700: #262626;
            --gray-600: #404040;
            --gray-500: #808080;
            --gray-400: #8a8a8a;
            --gray-300: #b0b0b0;
            --gray-200: #d4d4d4;
            --gray-100: #f0f0f0;
            --accent: #a78bfa;
            --blue: #60a5fa;
            --emerald: #34d399;
        }

        html { height: 100%; }

        body {
            font-family: 'Instrument Sans', system-ui, -apple-system, sans-serif;
            background: var(--gray-950);
            color: var(--gray-300);
            -webkit-font-smoothing: antialiased;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Noise texture */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 9999;
            pointer-events: none;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 256px 256px;
        }

        /* Grid background */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: radial-gradient(ellipse 60% 50% at 50% 40%, black, transparent);
            pointer-events: none;
        }

        /* Glow */
        .glow {
            position: fixed;
            width: 600px;
            height: 400px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -60%);
            background: radial-gradient(ellipse, rgba(167, 139, 250, 0.07), transparent 70%);
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 24px;
        }

        .logo {
            height: 36px;
            width: auto;
            margin-bottom: 48px;
            opacity: 0.9;
        }

        h1 {
            font-size: clamp(40px, 6vw, 64px);
            font-weight: 700;
            color: var(--gray-100);
            letter-spacing: -0.035em;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        h1 .gradient {
            background: linear-gradient(135deg, var(--accent), var(--blue), var(--emerald));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 17px;
            color: var(--gray-500);
            line-height: 1.7;
            max-width: 440px;
            margin: 0 auto 40px;
        }

        .gh-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-200);
            text-decoration: none;
            transition: all 0.2s;
        }

        .gh-link:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.14);
        }

        .gh-link svg { width: 18px; height: 18px; fill: currentColor; }

        /* Animations */
        @keyframes fade-up {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-in { animation: fade-up 0.6s ease-out both; }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="content">
        <img src="/images/name.png" alt="Vaxtly" class="logo animate-in">
        <h1 class="animate-in delay-1">
            Something new<br><span class="gradient">is coming.</span>
        </h1>
        <p class="animate-in delay-2">
            We're rebuilding Vaxtly from the ground up.<br>
            Stay tuned.

            Follow on GitHub
